name: Deploy Omega Server

on:
  push:
    branches:
      - main
    paths:
      - "omega-server/**"
      - "omega-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/setup_nat.sh"
      - "deploy/update_server.sh"
      - "deploy/diagnose_server.sh"
      - "deploy/omega-server.service"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: omega-server-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build omega-server
        run: cargo build --release -p omega-server

      - name: Prepare deploy bundle
        run: |
          mkdir -p dist
          cp target/release/omega-server dist/omega-server
          cp deploy/setup_nat.sh dist/setup_nat.sh
          cp deploy/update_server.sh dist/update_server.sh
          cp deploy/diagnose_server.sh dist/diagnose_server.sh
          cp deploy/omega-server.service dist/omega-server.service
          chmod +x dist/omega-server dist/setup_nat.sh dist/update_server.sh dist/diagnose_server.sh

      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Normalize deploy config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n\t ')"
          PORT="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '\r\n\t ')"
          USER="$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n\t ')"

          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST is empty"
            exit 1
          fi

          if [ -z "$USER" ]; then
            echo "DEPLOY_USER is empty"
            exit 1
          fi

          if [ -z "$PORT" ]; then
            PORT="22"
          fi

          if echo "$HOST" | grep -Eq '^https?://' || echo "$HOST" | grep -q '@'; then
            echo "DEPLOY_HOST must be host/IP only (without protocol and without user@)"
            exit 1
          fi

          if ! echo "$PORT" | grep -Eq '^[0-9]+$'; then
            echo "DEPLOY_PORT must be numeric"
            exit 1
          fi

          echo "DEPLOY_HOST_CLEAN=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT_CLEAN=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_CLEAN=$USER" >> "$GITHUB_ENV"

      - name: Add known hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          KNOWN="$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r')"

          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Remove stale keys for host/port to avoid host key mismatch after server reinstall/rotation
          ssh-keygen -R "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          ssh-keygen -R "[$HOST]:$PORT" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true

          # Prefer a pinned host key from secrets for deterministic deploys.
          # Fall back to live keyscan only when no pinned key is configured.
          if [ -n "$KNOWN" ]; then
            printf "%s\n" "$KNOWN" >> ~/.ssh/known_hosts
          else
            SCANNED="$(ssh-keyscan -4 -T 10 -H -p "$PORT" "$HOST" 2>/dev/null || true)"
            if [ -n "$SCANNED" ]; then
              printf "%s\n" "$SCANNED" >> ~/.ssh/known_hosts
            else
              echo "Unable to fetch SSH host key via ssh-keyscan for $HOST:$PORT"
              echo "DEPLOY_KNOWN_HOSTS secret is empty, so there is no fallback host key."
              echo "Check DEPLOY_HOST/DEPLOY_PORT, and remember DEPLOY_PORT is the SSH connection port used by GitHub Actions."
              echo "If SSH is on a non-default port, set DEPLOY_PORT in GitHub Secrets."
              echo "You can also fill DEPLOY_KNOWN_HOSTS with: ssh-keyscan -H -p $PORT $HOST"
              echo "Check network access from GitHub runner and that the server allows SSH from the public internet."
              exit 1
            fi
          fi

          if ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 && \
             ! ssh-keygen -F "[$HOST]:$PORT" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "No host key entry found in known_hosts for $HOST:$PORT"
            exit 1
          fi

      - name: Upload bundle
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          USER="$DEPLOY_USER_CLEAN"
          REMOTE_BASE="${DEPLOY_PATH:-/tmp/omega-deploy}"
          REMOTE_DIR="$REMOTE_BASE/$GITHUB_SHA"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" "mkdir -p '$REMOTE_DIR'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$PORT" dist/omega-server dist/setup_nat.sh dist/update_server.sh dist/diagnose_server.sh dist/omega-server.service "$USER@$HOST:$REMOTE_DIR/"

      - name: Deploy on server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
          DEPLOY_INSTALL_DIR: ${{ secrets.DEPLOY_INSTALL_DIR }}
          DEPLOY_KEEP_RELEASES: ${{ secrets.DEPLOY_KEEP_RELEASES }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          USER="$DEPLOY_USER_CLEAN"
          REMOTE_BASE="${DEPLOY_PATH:-/tmp/omega-deploy}"
          REMOTE_DIR="$REMOTE_BASE/$GITHUB_SHA"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            "chmod +x '$REMOTE_DIR/update_server.sh' '$REMOTE_DIR/omega-server' && \
             OMEGA_SERVICE_NAME='${DEPLOY_SERVICE_NAME:-omega-server}' \
             OMEGA_INSTALL_DIR='${DEPLOY_INSTALL_DIR:-/opt/omega}' \
             OMEGA_KEEP_RELEASES='${DEPLOY_KEEP_RELEASES:-5}' \
             OMEGA_RELEASE_ID='$GITHUB_SHA' \
             sudo '$REMOTE_DIR/update_server.sh' '$REMOTE_DIR/omega-server' '$REMOTE_DIR/omega-server.service'"

      - name: Re-apply network rules
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_CLIENT_CIDR: ${{ secrets.DEPLOY_CLIENT_CIDR }}
          DEPLOY_VPN_PORT_VALUE: ${{ secrets.DEPLOY_VPN_PORT }}
          DEPLOY_VPN_PROTOCOL_VALUE: ${{ secrets.DEPLOY_VPN_PROTOCOL }}
          DEPLOY_METRICS_PORT_VALUE: ${{ secrets.DEPLOY_METRICS_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          USER="$DEPLOY_USER_CLEAN"
          REMOTE_BASE="${DEPLOY_PATH:-/tmp/omega-deploy}"
          REMOTE_DIR="$REMOTE_BASE/$GITHUB_SHA"
          CLIENT_CIDR="$(printf '%s' "${DEPLOY_CLIENT_CIDR:-10.7.0.0/16}" | tr -d '\r\n\t ')"
          VPN_PORT="$(printf '%s' "${DEPLOY_VPN_PORT_VALUE:-443}" | tr -d '\r\n\t ')"
          VPN_PROTOCOL="$(printf '%s' "${DEPLOY_VPN_PROTOCOL_VALUE:-udp}" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
          METRICS_PORT="$(printf '%s' "${DEPLOY_METRICS_PORT_VALUE:-9090}" | tr -d '\r\n\t ')"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            "chmod +x '$REMOTE_DIR/setup_nat.sh' && \
             OMEGA_CLIENT_CIDR='$CLIENT_CIDR' \
             OMEGA_VPN_PORT='$VPN_PORT' \
             OMEGA_VPN_PROTO='$VPN_PROTOCOL' \
             OMEGA_SSH_PORT='${PORT}' \
             OMEGA_METRICS_PUBLIC='1' \
             OMEGA_METRICS_PORT='$METRICS_PORT' \
             sudo '$REMOTE_DIR/setup_nat.sh'"

      - name: Run post-deploy diagnostics
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
          DEPLOY_CLIENT_CIDR: ${{ secrets.DEPLOY_CLIENT_CIDR }}
          DEPLOY_VPN_PORT_VALUE: ${{ secrets.DEPLOY_VPN_PORT }}
          DEPLOY_VPN_PROTOCOL_VALUE: ${{ secrets.DEPLOY_VPN_PROTOCOL }}
          DEPLOY_METRICS_PORT_VALUE: ${{ secrets.DEPLOY_METRICS_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          USER="$DEPLOY_USER_CLEAN"
          REMOTE_BASE="${DEPLOY_PATH:-/tmp/omega-deploy}"
          REMOTE_DIR="$REMOTE_BASE/$GITHUB_SHA"
          CLIENT_CIDR="$(printf '%s' "${DEPLOY_CLIENT_CIDR:-10.7.0.0/16}" | tr -d '\r\n\t ')"
          VPN_PORT="$(printf '%s' "${DEPLOY_VPN_PORT_VALUE:-443}" | tr -d '\r\n\t ')"
          VPN_PROTOCOL="$(printf '%s' "${DEPLOY_VPN_PROTOCOL_VALUE:-udp}" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
          METRICS_PORT="$(printf '%s' "${DEPLOY_METRICS_PORT_VALUE:-9090}" | tr -d '\r\n\t ')"

          if [ -z "$CLIENT_CIDR" ]; then
            CLIENT_CIDR="10.7.0.0/16"
          fi

          if [ -z "$VPN_PORT" ]; then
            VPN_PORT="443"
          fi

          if [ -z "$VPN_PROTOCOL" ]; then
            VPN_PROTOCOL="udp"
          fi

          if [ -z "$METRICS_PORT" ]; then
            METRICS_PORT="9090"
          fi

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            "chmod +x '$REMOTE_DIR/diagnose_server.sh' && \
             OMEGA_SERVICE_NAME='${DEPLOY_SERVICE_NAME:-omega-server}' \
             OMEGA_CLIENT_CIDR='$CLIENT_CIDR' \
             OMEGA_VPN_PORT='$VPN_PORT' \
             OMEGA_VPN_PROTO='$VPN_PROTOCOL' \
             OMEGA_SSH_PORT='${PORT}' \
             OMEGA_METRICS_PUBLIC='1' \
             OMEGA_METRICS_PORT='$METRICS_PORT' \
             sudo '$REMOTE_DIR/diagnose_server.sh'"
