name: Deploy Omega Server

on:
  push:
    branches:
      - main
    paths:
      - "omega-server/**"
      - "omega-core/**"
      - "omega-reality/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/setup_nat.sh"
      - "deploy/update_server.sh"
      - "deploy/diagnose_server.sh"
      - "deploy/omega-server.service"
      - "deploy/setup_admin.sh"
      - "deploy/renew_admin_tls.sh"
      - "deploy/check_admin_https.py"
      - "deploy/omega-admin-tls-renew.service"
      - "deploy/omega-admin-tls-renew.timer"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: omega-server-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build omega-server
        run: cargo build --release -p omega-server

      - name: Prepare deploy bundle
        run: |
          mkdir -p dist
          cp target/release/omega-server dist/omega-server
          cp deploy/setup_nat.sh dist/setup_nat.sh
          cp deploy/update_server.sh dist/update_server.sh
          cp deploy/diagnose_server.sh dist/diagnose_server.sh
          cp deploy/omega-server.service dist/omega-server.service
          cp deploy/setup_admin.sh deploy/renew_admin_tls.sh deploy/omega-admin-tls-renew.service deploy/omega-admin-tls-renew.timer dist/
          cp deploy/check_admin_https.py dist/
          chmod +x dist/omega-server dist/setup_nat.sh dist/update_server.sh dist/diagnose_server.sh

      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Normalize deploy config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
          DEPLOY_INSTALL_DIR: ${{ secrets.DEPLOY_INSTALL_DIR }}
          DEPLOY_KEEP_RELEASES: ${{ secrets.DEPLOY_KEEP_RELEASES }}
        run: |
          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n\t ')"
          PORT="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '\r\n\t ')"
          USER="$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n\t ')"
          REMOTE_BASE="$(printf '%s' "${DEPLOY_PATH:-/tmp/omega-deploy}" | tr -d '\r\n\t ')"
          INSTALL_DIR="$(printf '%s' "${DEPLOY_INSTALL_DIR:-/opt/omega}" | tr -d '\r\n\t ')"
          SERVICE="$(printf '%s' "${DEPLOY_SERVICE_NAME:-omega-server}" | tr -d '\r\n\t ')"
          KEEP_RELEASES="$(printf '%s' "${DEPLOY_KEEP_RELEASES:-5}" | tr -d '\r\n\t ')"
          REMOTE_BASE="${REMOTE_BASE:-/tmp/omega-deploy}"
          INSTALL_DIR="${INSTALL_DIR:-/opt/omega}"
          SERVICE="${SERVICE:-omega-server}"
          KEEP_RELEASES="${KEEP_RELEASES:-5}"

          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST is empty"
            exit 1
          fi

          if [ -z "$USER" ]; then
            echo "DEPLOY_USER is empty"
            exit 1
          fi

          if [ -z "$PORT" ]; then
            PORT="22"
          fi

          if echo "$HOST" | grep -Eq '^https?://' || echo "$HOST" | grep -q '@'; then
            echo "DEPLOY_HOST must be host/IP only (without protocol and without user@)"
            exit 1
          fi

          if ! echo "$PORT" | grep -Eq '^[0-9]+$'; then
            echo "DEPLOY_PORT must be numeric"
            exit 1
          fi

          if ! [[ "$REMOTE_BASE" =~ ^/[A-Za-z0-9_./-]+$ && "$INSTALL_DIR" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo "Deploy directories must be absolute Linux paths without shell metacharacters."
            exit 1
          fi
          if ! [[ "$SERVICE" =~ ^[A-Za-z0-9_.@-]+$ && "$KEEP_RELEASES" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid service name or release retention count."
            exit 1
          fi

          echo "DEPLOY_HOST_CLEAN=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT_CLEAN=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_CLEAN=$USER" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH_CLEAN=$REMOTE_BASE" >> "$GITHUB_ENV"
          echo "DEPLOY_INSTALL_DIR_CLEAN=$INSTALL_DIR" >> "$GITHUB_ENV"
          echo "DEPLOY_SERVICE_NAME_CLEAN=$SERVICE" >> "$GITHUB_ENV"
          echo "DEPLOY_KEEP_RELEASES_CLEAN=$KEEP_RELEASES" >> "$GITHUB_ENV"

      - name: Add known hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          KNOWN="$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r')"

          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Remove stale keys for host/port to avoid host key mismatch after server reinstall/rotation
          ssh-keygen -R "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          ssh-keygen -R "[$HOST]:$PORT" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true

          # Prefer a pinned host key from secrets for deterministic deploys.
          # Fall back to live keyscan only when no pinned key is configured.
          if [ -n "$KNOWN" ]; then
            printf "%s\n" "$KNOWN" >> ~/.ssh/known_hosts
          else
            SCANNED="$(ssh-keyscan -4 -T 10 -H -p "$PORT" "$HOST" 2>/dev/null || true)"
            if [ -n "$SCANNED" ]; then
              printf "%s\n" "$SCANNED" >> ~/.ssh/known_hosts
            else
              echo "Unable to fetch SSH host key via ssh-keyscan for $HOST:$PORT"
              echo "DEPLOY_KNOWN_HOSTS secret is empty, so there is no fallback host key."
              echo "Check DEPLOY_HOST/DEPLOY_PORT, and remember DEPLOY_PORT is the SSH connection port used by GitHub Actions."
              echo "If SSH is on a non-default port, set DEPLOY_PORT in GitHub Secrets."
              echo "You can also fill DEPLOY_KNOWN_HOSTS with: ssh-keyscan -H -p $PORT $HOST"
              echo "Check network access from GitHub runner and that the server allows SSH from the public internet."
              exit 1
            fi
          fi

          if ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 && \
             ! ssh-keygen -F "[$HOST]:$PORT" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "No host key entry found in known_hosts for $HOST:$PORT"
            exit 1
          fi

      - name: Upload bundle
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          USER="$DEPLOY_USER_CLEAN"
          REMOTE_BASE="$DEPLOY_PATH_CLEAN"
          REMOTE_DIR="$REMOTE_BASE/$GITHUB_SHA"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" "mkdir -p '$REMOTE_DIR'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$PORT" dist/* "$USER@$HOST:$REMOTE_DIR/"

      - name: Deploy on server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
          DEPLOY_INSTALL_DIR: ${{ secrets.DEPLOY_INSTALL_DIR }}
          DEPLOY_KEEP_RELEASES: ${{ secrets.DEPLOY_KEEP_RELEASES }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          USER="$DEPLOY_USER_CLEAN"
          REMOTE_BASE="$DEPLOY_PATH_CLEAN"
          REMOTE_DIR="$REMOTE_BASE/$GITHUB_SHA"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            "sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates openssl python3 python3-venv curl util-linux && \
             chmod +x '$REMOTE_DIR/update_server.sh' '$REMOTE_DIR/omega-server' && \
             sudo env \
               OMEGA_SERVICE_NAME='$DEPLOY_SERVICE_NAME_CLEAN' \
               OMEGA_INSTALL_DIR='$DEPLOY_INSTALL_DIR_CLEAN' \
               OMEGA_KEEP_RELEASES='$DEPLOY_KEEP_RELEASES_CLEAN' \
               OMEGA_RELEASE_ID='$GITHUB_SHA' \
               OMEGA_DEPLOY_HEALTHCHECK='0' \
               '$REMOTE_DIR/update_server.sh' '$REMOTE_DIR/omega-server' '$REMOTE_DIR/omega-server.service'"

      - name: Re-apply network rules
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_CLIENT_CIDR: ${{ secrets.DEPLOY_CLIENT_CIDR }}
          DEPLOY_CLIENT_CIDR_V6: ${{ secrets.DEPLOY_CLIENT_CIDR_V6 }}
          DEPLOY_VPN_PORT_VALUE: ${{ secrets.DEPLOY_VPN_PORT }}
          DEPLOY_VPN_PROTOCOL_VALUE: ${{ secrets.DEPLOY_VPN_PROTOCOL }}
          DEPLOY_TCP_ENABLE_VALUE: ${{ secrets.DEPLOY_TCP_ENABLE }}
          DEPLOY_TCP_PORT_VALUE: ${{ secrets.DEPLOY_TCP_PORT }}
          DEPLOY_VPN_IPV6_MODE_VALUE: ${{ secrets.DEPLOY_VPN_IPV6_MODE }}
          DEPLOY_ADMIN_WEB_PUBLIC_VALUE: ${{ secrets.DEPLOY_ADMIN_WEB_PUBLIC }}
          DEPLOY_ADMIN_WEB_PORT_VALUE: ${{ secrets.DEPLOY_ADMIN_WEB_PORT }}
          DEPLOY_METRICS_PUBLIC_VALUE: ${{ secrets.DEPLOY_METRICS_PUBLIC }}
          DEPLOY_METRICS_PORT_VALUE: ${{ secrets.DEPLOY_METRICS_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          USER="$DEPLOY_USER_CLEAN"
          REMOTE_BASE="$DEPLOY_PATH_CLEAN"
          REMOTE_DIR="$REMOTE_BASE/$GITHUB_SHA"
          CLIENT_CIDR="$(printf '%s' "${DEPLOY_CLIENT_CIDR:-10.7.0.0/16}" | tr -d '\r\n\t ')"
          CLIENT_CIDR_V6="$(printf '%s' "${DEPLOY_CLIENT_CIDR_V6:-fd70:7::/64}" | tr -d '\r\n\t ')"
          VPN_PORT="$(printf '%s' "${DEPLOY_VPN_PORT_VALUE:-443}" | tr -d '\r\n\t ')"
          VPN_PROTOCOL="$(printf '%s' "${DEPLOY_VPN_PROTOCOL_VALUE:-udp}" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
          TCP_ENABLE="$(printf '%s' "${DEPLOY_TCP_ENABLE_VALUE:-1}" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
          TCP_PORT="$(printf '%s' "${DEPLOY_TCP_PORT_VALUE:-$VPN_PORT}" | tr -d '\r\n\t ')"
          VPN_IPV6_MODE="$(printf '%s' "${DEPLOY_VPN_IPV6_MODE_VALUE:-nat66}" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
          ADMIN_WEB_PUBLIC="$(printf '%s' "${DEPLOY_ADMIN_WEB_PUBLIC_VALUE:-1}" | tr -d '\r\n\t ')"
          ADMIN_WEB_PORT="$(printf '%s' "${DEPLOY_ADMIN_WEB_PORT_VALUE:-8443}" | tr -d '\r\n\t ')"
          METRICS_PUBLIC="$(printf '%s' "${DEPLOY_METRICS_PUBLIC_VALUE:-0}" | tr -d '\r\n\t ')"
          METRICS_PORT="$(printf '%s' "${DEPLOY_METRICS_PORT_VALUE:-9090}" | tr -d '\r\n\t ')"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            "chmod +x '$REMOTE_DIR/setup_nat.sh' && \
             sudo env \
               OMEGA_CLIENT_CIDR='$CLIENT_CIDR' \
               OMEGA_CLIENT_CIDR_V6='$CLIENT_CIDR_V6' \
               OMEGA_VPN_PORT='$VPN_PORT' \
               OMEGA_VPN_PROTO='$VPN_PROTOCOL' \
               OMEGA_TCP_ENABLE='$TCP_ENABLE' \
               OMEGA_TCP_PORT='$TCP_PORT' \
               OMEGA_VPN_IPV6_MODE='$VPN_IPV6_MODE' \
               OMEGA_SSH_PORT='${PORT}' \
               OMEGA_ADMIN_WEB_PUBLIC='$ADMIN_WEB_PUBLIC' \
               OMEGA_ADMIN_WEB_PORT='$ADMIN_WEB_PORT' \
               OMEGA_METRICS_PUBLIC='$METRICS_PUBLIC' \
               OMEGA_METRICS_PORT='$METRICS_PORT' \
               '$REMOTE_DIR/setup_nat.sh'"

      - name: Run post-deploy diagnostics
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
          DEPLOY_CLIENT_CIDR: ${{ secrets.DEPLOY_CLIENT_CIDR }}
          DEPLOY_CLIENT_CIDR_V6: ${{ secrets.DEPLOY_CLIENT_CIDR_V6 }}
          DEPLOY_VPN_PORT_VALUE: ${{ secrets.DEPLOY_VPN_PORT }}
          DEPLOY_VPN_PROTOCOL_VALUE: ${{ secrets.DEPLOY_VPN_PROTOCOL }}
          DEPLOY_TCP_ENABLE_VALUE: ${{ secrets.DEPLOY_TCP_ENABLE }}
          DEPLOY_TCP_PORT_VALUE: ${{ secrets.DEPLOY_TCP_PORT }}
          DEPLOY_VPN_IPV6_MODE_VALUE: ${{ secrets.DEPLOY_VPN_IPV6_MODE }}
          DEPLOY_ADMIN_WEB_PUBLIC_VALUE: ${{ secrets.DEPLOY_ADMIN_WEB_PUBLIC }}
          DEPLOY_ADMIN_WEB_PORT_VALUE: ${{ secrets.DEPLOY_ADMIN_WEB_PORT }}
          DEPLOY_METRICS_PUBLIC_VALUE: ${{ secrets.DEPLOY_METRICS_PUBLIC }}
          DEPLOY_METRICS_PORT_VALUE: ${{ secrets.DEPLOY_METRICS_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="$DEPLOY_HOST_CLEAN"
          PORT="$DEPLOY_PORT_CLEAN"
          USER="$DEPLOY_USER_CLEAN"
          REMOTE_BASE="$DEPLOY_PATH_CLEAN"
          REMOTE_DIR="$REMOTE_BASE/$GITHUB_SHA"
          CLIENT_CIDR="$(printf '%s' "${DEPLOY_CLIENT_CIDR:-10.7.0.0/16}" | tr -d '\r\n\t ')"
          CLIENT_CIDR_V6="$(printf '%s' "${DEPLOY_CLIENT_CIDR_V6:-fd70:7::/64}" | tr -d '\r\n\t ')"
          VPN_PORT="$(printf '%s' "${DEPLOY_VPN_PORT_VALUE:-443}" | tr -d '\r\n\t ')"
          VPN_PROTOCOL="$(printf '%s' "${DEPLOY_VPN_PROTOCOL_VALUE:-udp}" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
          TCP_ENABLE="$(printf '%s' "${DEPLOY_TCP_ENABLE_VALUE:-1}" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
          TCP_PORT="$(printf '%s' "${DEPLOY_TCP_PORT_VALUE:-$VPN_PORT}" | tr -d '\r\n\t ')"
          VPN_IPV6_MODE="$(printf '%s' "${DEPLOY_VPN_IPV6_MODE_VALUE:-nat66}" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
          ADMIN_WEB_PUBLIC="$(printf '%s' "${DEPLOY_ADMIN_WEB_PUBLIC_VALUE:-1}" | tr -d '\r\n\t ')"
          ADMIN_WEB_PORT="$(printf '%s' "${DEPLOY_ADMIN_WEB_PORT_VALUE:-8443}" | tr -d '\r\n\t ')"
          METRICS_PUBLIC="$(printf '%s' "${DEPLOY_METRICS_PUBLIC_VALUE:-0}" | tr -d '\r\n\t ')"
          METRICS_PORT="$(printf '%s' "${DEPLOY_METRICS_PORT_VALUE:-9090}" | tr -d '\r\n\t ')"

          if [ -z "$CLIENT_CIDR" ]; then
            CLIENT_CIDR="10.7.0.0/16"
          fi

          if [ -z "$VPN_PORT" ]; then
            VPN_PORT="443"
          fi

          if [ -z "$VPN_PROTOCOL" ]; then
            VPN_PROTOCOL="udp"
          fi

          if [ -z "$TCP_ENABLE" ]; then
            TCP_ENABLE="1"
          fi

          if [ -z "$TCP_PORT" ]; then
            TCP_PORT="$VPN_PORT"
          fi

          if [ -z "$VPN_IPV6_MODE" ]; then
            VPN_IPV6_MODE="nat66"
          fi

          if [ -z "$CLIENT_CIDR_V6" ]; then
            CLIENT_CIDR_V6="fd70:7::/64"
          fi

          if [ -z "$ADMIN_WEB_PUBLIC" ]; then
            ADMIN_WEB_PUBLIC="1"
          fi

          if [ -z "$ADMIN_WEB_PORT" ]; then
            ADMIN_WEB_PORT="8443"
          fi

          if [ -z "$METRICS_PUBLIC" ]; then
            METRICS_PUBLIC="0"
          fi

          if [ -z "$METRICS_PORT" ]; then
            METRICS_PORT="9090"
          fi

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            "chmod +x '$REMOTE_DIR/diagnose_server.sh' && \
             sudo env \
               OMEGA_SERVICE_NAME='$DEPLOY_SERVICE_NAME_CLEAN' \
               OMEGA_CLIENT_CIDR='$CLIENT_CIDR' \
               OMEGA_CLIENT_CIDR_V6='$CLIENT_CIDR_V6' \
               OMEGA_VPN_PORT='$VPN_PORT' \
               OMEGA_VPN_PROTO='$VPN_PROTOCOL' \
               OMEGA_TCP_ENABLE='$TCP_ENABLE' \
               OMEGA_TCP_PORT='$TCP_PORT' \
               OMEGA_VPN_IPV6_MODE='$VPN_IPV6_MODE' \
               OMEGA_SSH_PORT='${PORT}' \
               OMEGA_ADMIN_WEB_PUBLIC='$ADMIN_WEB_PUBLIC' \
               OMEGA_ADMIN_WEB_PORT='$ADMIN_WEB_PORT' \
               OMEGA_METRICS_PUBLIC='$METRICS_PUBLIC' \
               OMEGA_METRICS_PORT='$METRICS_PORT' \
               '$REMOTE_DIR/diagnose_server.sh'"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT" "$USER@$HOST" \
            "sudo python3 '$REMOTE_DIR/check_admin_https.py'"
