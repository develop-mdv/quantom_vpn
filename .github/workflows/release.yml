name: Release Omega VPN

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version tag"; exit 1; }
          test -f "docs/releases/$TAG.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Test server installer
        run: |
          bash -n install.sh deploy/tests/install_test.sh
          bash deploy/tests/install_test.sh

  server:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test server
        run: cargo test --locked -p omega-server
      - name: Build static server
        env:
          CC: musl-gcc
        run: cargo build --locked --release -p omega-server --target ${{ matrix.target }}
      - name: Smoke test server binary
        env:
          TARGET: ${{ matrix.target }}
        run: OMEGA_IDENTITY_DB="$RUNNER_TEMP/release-identity.json" "target/$TARGET/release/omega-server" admin list_users
      - name: Package server
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist bundle
          cp "target/$TARGET/release/omega-server" bundle/
          cp deploy/{setup_nat.sh,update_server.sh,diagnose_server.sh,omega-server.service} bundle/
          # Avoid CRLF in release scripts even when built from a Windows checkout.
          sed -i 's/\r$//' bundle/*.sh bundle/*.service
          chmod +x bundle/omega-server bundle/*.sh
          tar -czf "dist/omega-server-linux-$ARCH.tar.gz" -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test Windows client
        run: dotnet run --project omega-client-app/tests/Omega.Client.App.Tests/Omega.Client.App.Tests.csproj --configuration Release
      - name: Build installer and portable client
        shell: pwsh
        run: |
          ./omega-client-app/package-windows-client.ps1
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path omega-client-app/artifacts/windows-client/installer/* -DestinationPath dist/OmegaVPN-windows-x64-setup.zip
          Compress-Archive -Path omega-client-app/artifacts/windows-client/portable/OmegaVPN -DestinationPath dist/OmegaVPN-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
      - name: Build and test Android APK
        working-directory: omega-android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Package test APK
        run: |
          mkdir dist
          cp omega-android/app/build/outputs/apk/debug/app-debug.apk dist/OmegaVPN-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, server, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip *.apk *.tar.gz > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Upload into a draft so a partially uploaded release cannot become latest.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Omega VPN $TAG" --notes-file "docs/releases/$TAG.md"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
