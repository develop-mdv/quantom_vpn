[workspace]
members = [
    "omega-core",
    "omega-core-crypto",
    "omega-core-wire",
    "omega-transport",
    "omega-stealth",
    "omega-relay",
    "omega-control",
    "omega-client-runtime",
    "omega-client-app",
    "omega-client",
    "omega-edge",
    "omega-exit",
    "omega-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ring = "0.17"
hkdf = "0.12"
sha2 = "0.10"
ml-kem = "0.2"
kem = "0.3.0-pre.0"
rand = "0.8"
x25519-dalek = "2"
tokio = { version = "1", features = ["full"] }
tun-rs = { version = "2.8", features = ["async"] }
bytes = "1"
byteorder = "1"
socket2 = "0.5"

dashmap = "6"
raptorq = "2.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
criterion = { version = "0.5", features = ["html_reports"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


