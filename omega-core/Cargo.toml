[package]
name = "omega-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compatibility facade over Omega v2 domain crates"

[features]
default = []
std = []
fec = ["omega-transport/fec"]

[dependencies]
omega-core-crypto = { path = "../omega-core-crypto" }
omega-core-wire = { path = "../omega-core-wire" }
omega-transport = { path = "../omega-transport", default-features = false }
omega-stealth = { path = "../omega-stealth" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "chaos_bench"
harness = false

[[bench]]
name = "crypto_bench"
harness = false
